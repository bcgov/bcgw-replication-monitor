<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="15" fill="#0F172A"/>

  <!-- Database -->
  <g transform="translate(-1 -1)">
    <ellipse cx="19" cy="15" rx="15" ry="6" fill="#F1F5F9"/>
    <rect x="4" y="15" width="30" height="28" fill="#CBD5E1"/>
    <ellipse cx="19" cy="43" rx="15" ry="6" fill="#94A3B8"/>

    <!-- Internal layers -->
    <ellipse
      cx="19"
      cy="24"
      rx="15"
      ry="6"
      fill="none"
      stroke="#64748B"
      stroke-width="1.2"
    />
    <ellipse
      cx="19"
      cy="33"
      rx="15"
      ry="6"
      fill="none"
      stroke="#64748B"
      stroke-width="1.2"
    />
  </g>

  <!-- Dashboard / job list -->
  <g transform="translate(35 6)">
    <rect
      width="27"
      height="42"
      rx="7"
      fill="#111827"
      stroke="#334155"
      stroke-width="1.5"
    />

    <!-- rows -->
    <circle cx="6" cy="10" r="2.3" fill="#22C55E"/>
    <rect x="11" y="8" width="12" height="4" rx="2" fill="#F8FAFC"/>

    <circle cx="6" cy="20" r="2.3" fill="#F59E0B"/>
    <rect x="11" y="18" width="10" height="4" rx="2" fill="#CBD5E1"/>

    <circle cx="6" cy="30" r="2.3" fill="#EF4444"/>
    <rect x="11" y="28" width="11" height="4" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Monitoring pulse -->
  <path
    d="M4 56
       L15 56
       L21 47
       L28 60
       L36 36
       L44 56
       L60 56"
    fill="none"
    stroke="url(#pulse)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>